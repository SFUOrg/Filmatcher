name: build_and_formatting

on:
    push:
        branches: ["task/6_addCI"]
    pull_request:
        branches: ["master", "dev"]

jobs:
    build:
        runs-on: ubuntu-latest
        services:
            mssql:
                image: mcr.microsoft.com/mssql/server:2022-latest
                env:
                    SA_PASSWORD: "trade787!"
                    ACCEPT_EULA: "Y"
                    MSSQL_PID: "Express"
                ports:
                    - 1433:1433
                options: >-
                    --health-cmd="/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'trade787!' -Q 'SELECT 1' || exit 1"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3
        steps:
        - uses: actions/checkout@v4
  
        - name: Install SQL Server tools
          run: |
            curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
            curl https://packages.microsoft.com/config/ubuntu/20.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y mssql-tools unixodbc-dev
            echo 'export PATH="$PATH:/opt/mssql-tools/bin"' >> ~/.bashrc

        - name: Wait for SQL Server
          run:  |
            for i in {1..30}; do
              if /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "trade787!" -Q "SELECT 1" > /dev/null 2>&1; then
                echo "SQL Server is ready"
                break
              else
                echo "Waiting for SQL Server... attempt $i"
                sleep 5
              fi
            done

        - name: Setup .NET
          uses: actions/setup-dotnet@v4
          with:
              dotnet-version: '8.0.x'

        - name: Restore dependencies
          run: dotnet restore

        - name: Build application
          run: dotnet build --no-restore

        - name: Create application database
          run: | 
            sqlcmd -S localhost -U sa -P "trade787!" -Q "CREATE DATABASE MyApplicationDB"

        - name: Run database migrations
          run: dotnet ef database update --project Filmatch
          env: 
            ConnectionStrings_DefaultConnection: Server=localhost;Database=MyApplicationDB;User Id=sa;Password=trade787!;TrustServerCertificate=true;"

        - name: Formatting
          run: dotnet format --verify-no-changes  
          
